<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help System Test • CSMS</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/enhancements.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="theme-dark">
  <header class="top-bar" role="banner" aria-label="Top bar">
    <div class="search-container">
      <button class="search-trigger" type="button" aria-haspopup="dialog" aria-controls="searchOverlay">
        <span>Search modules</span>
        <kbd>Ctrl</kbd> + <kbd>K</kbd>
      </button>
    </div>
    <div class="top-bar-right">
      <button class="help-trigger" type="button" aria-label="Open help" onclick="openHelp()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        Help
      </button>
      <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar" onclick="toggleSidebar()">☰ Menu</button>
      <span class="user-name">Test User</span>
    </div>
  </header>

  <main class="main-content">
    <div class="section-header">
      <h1>Help System Test</h1>
      <p>This page tests the help system functionality.</p>
    </div>

    <div class="card">
      <h3>Test Help Features</h3>
      <p>Click the buttons below to test different help features:</p>
      <div style="margin-top: 1rem;">
        <button class="btn btn-primary" onclick="openHelp()">Open Help Overlay</button>
        <button class="btn" onclick="openGlobalSearch()">Open Search</button>
      </div>
    </div>
  </main>

  <div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Global search">
    <div class="search-container">
      <div class="search-header">
        <input id="globalSearch" class="global-search-input" type="text" placeholder="Search modules…">
        <button class="search-close" type="button" aria-label="Close search" onclick="closeGlobalSearch()">✕</button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <script src="js/help-templates.js"></script>
  <script src="js/script.js"></script>
  <script>
    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize search
      initSearch();
      
      // Add keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + K for search
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          openGlobalSearch();
        }
      });
    });
  </script>
</body>
</html>
